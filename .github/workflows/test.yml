name: Tests

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Verify generated install icons
        run: |
          npm run build:icons
          git diff --exit-code -- apple-touch-icon.png assets/apple-touch-icon.png assets/zeitplural-icon-192.png assets/zeitplural-icon-512.png assets/zeitplural-maskable-512.png
      - name: Run browser tests and enforce coverage
        run: npm run coverage
      - name: Type-check JavaScript
        run: npm run typecheck
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
