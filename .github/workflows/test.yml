name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify generated install icons
        run: |
          npm run build:icons
          git diff --exit-code -- apple-touch-icon.png assets/apple-touch-icon.png assets/zeitplural-icon-192.png assets/zeitplural-icon-512.png assets/zeitplural-maskable-512.png
      - name: Run tests
        run: npm test
      - name: Type-check JavaScript
        run: npm run typecheck
